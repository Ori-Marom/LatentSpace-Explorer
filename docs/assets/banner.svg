<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="440" viewBox="0 0 1400 440" role="img" aria-labelledby="title desc">
  <title id="title">LatentSpace Explorer</title>
  <desc id="desc">Explore the geometry of language. An illustrative constellation of connected word vectors.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#101b30"/><stop offset="1" stop-color="#07101e"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#28797c" stop-opacity=".3"/><stop offset="1" stop-color="#28797c" stop-opacity="0"/></radialGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#91b8d6" stroke-opacity=".06"/></pattern>
  </defs>
  <rect width="1400" height="440" rx="22" fill="url(#bg)"/>
  <rect width="1400" height="440" rx="22" fill="url(#grid)"/>
  <ellipse cx="1080" cy="190" rx="350" ry="250" fill="url(#glow)"/>
  <g font-family="Segoe UI,Arial,sans-serif">
