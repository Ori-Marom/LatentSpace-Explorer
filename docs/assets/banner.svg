    <g font-size="14" fill="#b7c9dd"><text x="956" y="152">meaning</text><text x="1083" y="123">context</text><text x="1245" y="233">language</text><text x="1097" y="264">vector</text></g>
    <text x="1000" y="401" font-size="11" letter-spacing="2" fill="#687f9a">ILLUSTRATIVE EMBEDDING SPACE</text>
