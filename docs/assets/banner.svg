    <text x="60" y="157" font-size="64" font-weight="700" letter-spacing="-2" fill="#f0f6fc">LatentSpace</text>
    <text x="61" y="222" font-size="58" font-weight="300" letter-spacing="-1" fill="#90b9ef">Explorer</text>
    <text x="64" y="270" font-size="21" fill="#a9b8cb">Turn word vectors into a space you can explore.</text>
    <g font-size="13" font-weight="600" fill="#d8e4f0">
