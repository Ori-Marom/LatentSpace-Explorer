      <rect x="371" y="311" width="164" height="32" rx="16" fill="#1b2d44"/><text x="392" y="332">WORD EMBEDDINGS</text>
    </g>
    <text x="64" y="401" font-size="12" letter-spacing="2" fill="#687f9a">VISUALIZE  /  COMPARE  /  PROJECT  /  DISCOVER</text>
    <g stroke="#28445f" stroke-width="1.3" fill="none">
      <path d="M800 327L1255 327M850 369V84M850 327L1175 94"/>
      <path d="M880 237L949 168L1011 203L1072 135L1147 174M949 168L1023 92L1072 135M1011 203L1081 259L1147 174L1231 238M1081 259L1167 300L1231 238M880 237L935 293L1081 259"/>
